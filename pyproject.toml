[project]
name = "idoly-account-export"
version = "0.1.0"
description = "Export IDOLY PRIDE account snapshots and verify local archives."
requires-python = ">=3.10"
dependencies = [
    "protobuf>=5.29.6,<6",
    "grpcio>=1.70,<2",
    "requests>=2.32,<3",
    "pycryptodome>=3.20,<4",
    "UnityPy>=1.25.3,<1.26",
    "Pillow>=11,<13",
    "rich>=13,<15",
]

[tool.uv]
package = false
